name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Maven resolves all dependencies before the first plugin runs, so the JOSM jar
      # (a system-scope dependency, not on Maven Central) must be fetched in a separate run.
      - name: Fetch JOSM jar
        run: mvn -B --no-transfer-progress validate
      - name: Build and test
        run: mvn -B --no-transfer-progress package
      - uses: actions/upload-artifact@v4
        with:
          name: josmmcp
          path: target/josmmcp.jar
