name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Maven resolves all dependencies before the first plugin runs, so the JOSM jar
      # (a system-scope dependency, not on Maven Central) must be fetched in a separate run.
      - name: Fetch JOSM jar
        run: mvn -B --no-transfer-progress validate
      - name: Build and test
        run: mvn -B --no-transfer-progress package
      - name: Publish release with plugin jar
        uses: softprops/action-gh-release@v2
        with:
          files: target/josmmcp.jar
          generate_release_notes: true
